<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 个人博客</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
<canvas id="field"></canvas>
<div class="nav">
    <div class="brand"><span class="dot"></span>个人博客</div>
    <div>
        <a href="/index.html">首页</a>
        <a href="/register.html">注册</a>
    </div>
</div>

<div class="auth-wrap">
    <h1 class="auth-title">Personal Blog</h1>
    <div class="auth-card">
        <div class="error" id="errorMsg"></div>
        <div class="form-item">
            <label for="username">用户名</label>
            <input id="username" type="text" placeholder="请输入用户名">
        </div>
        <div class="form-item">
            <label for="password">密码</label>
            <input id="password" type="password" placeholder="请输入密码">
        </div>
        <div class="auth-actions">
            <button class="auth-btn" onclick="login()">登录 <span class="arrow">▸</span></button>
        </div>
        <div class="tip">还没有账号？<a href="/register.html">去注册</a></div>
    </div>
</div>

<script>
    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.innerText = '';

        if (!username || !password) {
            errorMsg.innerText = '用户名和密码不能为空';
            return;
        }

        const res = await fetch('/api/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const result = await res.json();

        if (result.code === 200) {
            localStorage.setItem('token', result.data.token);
            localStorage.setItem('userId', result.data.userId);
            localStorage.setItem('nickname', result.data.nickname);
            localStorage.setItem('role', result.data.role);
            window.location.href = '/index.html';
        } else {
            errorMsg.innerText = result.msg || '登录失败';
        }
    }
</script>
<script src="/js/field.js"></script>
</body>
</html>
